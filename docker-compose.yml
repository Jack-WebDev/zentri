name: zentri

services:
  postgres:
    image: postgres:16-alpine
    container_name: zentri-postgres
    environment:
      POSTGRES_DB: zentri_dev
      POSTGRES_USER: zentri
      POSTGRES_PASSWORD: zentri
    ports:
      - "5434:5432"
    volumes:
      - zentri_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: zentri-mailpit
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    restart: unless-stopped

volumes:
  zentri_postgres_data:
